[project]
name = "boodschappenwijzer"
version = "0.1.0"
description = "Lokale boodschappenlijst en Nederlandse supermarktvergelijker"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "httpx>=0.27",
  "uvicorn>=0.30",
  "reportlab>=4.4,<6",
  "Pillow>=11,<13",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23", "pypdf>=5"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]
include-package-data = true

[tool.setuptools.package-data]
app = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
